# 4 - Acessar o Cardápio da Pastelaria Maria e retornar a tela anterior
appId: com.qazandoqafood
---
- runFlow:
    file: ../1 - Feature_Login/20 - Login com credenciais corretas.yaml
- tapOn: "Selecione seu endereço..."
- tapOn: "PERMITIR"
- tapOn: "Pastelaria da Maria"
- tapOn:
    id: "back-button"
- assertVisible: "Pesquise seu restaurante..."