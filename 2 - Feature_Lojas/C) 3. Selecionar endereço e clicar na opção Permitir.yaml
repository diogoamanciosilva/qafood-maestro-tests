# 3. Permissão e seleção de endereço

appId: com.qazandoqafood
---
- launchApp
- tapOn:
    id: "email"
- inputText: "teste@teste.com"
- tapOn:
    id: "password"
- inputText: "123456"
- tapOn:
    id: "login-button"
- scroll
- tapOn: "Selecione seu endereço..."
- assertVisible: "PERMITIR"
- tapOn: "PERMITIR"
- assertVisible: "Pesquise seu restaurante..."