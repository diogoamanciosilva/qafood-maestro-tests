- tapOn:
    id: "open-cart-button"
- assertVisible: "Pastel de carne"
- assertVisible: "1x"
- pressKey: "Back"
- assertVisible: "1 Produtos"
- tapOn:
    id: "add-item-buttom"
    index: 2
- tapOn:
    id: "open-cart-button"
- assertVisible: "Pastel de carne"
- assertVisible: "1x"
- assertVisible: "Pastel de queijo"
- assertVisible:
    text: "1x"
    index: 1