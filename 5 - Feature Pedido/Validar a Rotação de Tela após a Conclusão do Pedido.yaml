appId: com.qazandoqafood
---
- runFlow:
    file: ../1 - Feature_Login/20 - Login com credenciais corretas.yaml
- tapOn: "Selecione seu endereço..."
- tapOn: "PERMITIR"
- tapOn: "Pastelaria da Maria"
- tapOn:
    id: "add-item-buttom"
- assertVisible: "1 Produtos"
- tapOn:
    id: "open-cart-button"
- assertVisible: "Pastel de carne"
- tapOn: "CONFIRMAR PEDIDO"
- scrollUntilVisible:
    element: "Dinheiro"
    direction: DOWN
- tapOn: "Dinheiro"
- scrollUntilVisible:
    element: "FAZER PEDIDO"
    direction: DOWN
- tapOn: "FAZER PEDIDO"
- assertVisible: "Pedido realizado"
- setOrientation: LANDSCAPE_LEFT
- assertVisible: "Pedido realizado"
- assertVisible: "Acompanhar pedido"
- assertVisible: "Previsão de etrega"
- assertVisible: "Hoje, em 15-50 min"
- assertVisible: "O pedido está sendo preparado e logo sairá para a entrega"
- setOrientation: PORTRAIT
- assertVisible: "Pedido realizado"