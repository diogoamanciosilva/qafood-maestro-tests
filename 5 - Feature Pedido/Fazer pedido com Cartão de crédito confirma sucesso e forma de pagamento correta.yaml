appId: com.qazandoqafood
---
- runFlow:
    file: ../1 - Feature_Login/20 - Login com credenciais corretas.yaml
- tapOn: "Selecione seu endereço..."
- tapOn: "PERMITIR"
- tapOn: "Pastelaria da Maria"
- tapOn:
    id: "add-item-buttom"
- assertVisible: "1 Produtos"
- tapOn:
    id: "open-cart-button"
- assertVisible: "Pastel de carne"
- tapOn: "CONFIRMAR PEDIDO"
- scrollUntilVisible:
    element: "Cartão de crédito"
    direction: DOWN
- tapOn: "Cartão de crédito"
- scrollUntilVisible:
    element: "FAZER PEDIDO"
    direction: DOWN
- tapOn: "FAZER PEDIDO"
- assertVisible: "Pedido realizado"
- assertVisible: "Pagamento"
- assertVisible: "Cartão de crédito"